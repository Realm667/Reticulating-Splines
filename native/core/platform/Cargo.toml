[package]
name = "sc2k_platform"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Platform rules of OpenSC2K: release checks, versions, and mod manifests, without engine types"

[dependencies]
sc2k_formats = { path = "../formats" }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
